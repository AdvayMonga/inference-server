name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"        # Mondays 07:00 UTC — the GPU lane, which nothing else exercises
  workflow_dispatch:
    inputs:
      runpod_gpu:
        description: "RunPod GPU type id for the CUDA gate"
        default: "NVIDIA GeForce RTX 4090"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Which lanes does this change need? The engine and the loop share no imports in either
  # direction, so a change to one cannot break the other — running both every time is just
  # waiting. Unknown paths default to the engine lane: safe, not fast.
  changes:
    runs-on: ubuntu-latest
    outputs:
      loop: ${{ steps.classify.outputs.loop }}
      engine: ${{ steps.classify.outputs.engine }}
      cuda: ${{ steps.classify.outputs.cuda }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          range=""
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            echo "loop=false"   >> "$GITHUB_OUTPUT"
            echo "engine=false" >> "$GITHUB_OUTPUT"
            echo "cuda=false"   >> "$GITHUB_OUTPUT"
            echo "$EVENT — GPU lane only"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE...HEAD"
          fi

          if [ -z "$range" ]; then
            # No diffable range (force push, first push). Run everything.
            echo "loop=true"   >> "$GITHUB_OUTPUT"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "cuda=false"  >> "$GITHUB_OUTPUT"
            echo "no range to diff — running both lanes"
            exit 0
          fi

          # Capture before reading: a failure inside process substitution is invisible to
          # `set -e`, so the loop would read nothing and skip every lane, green. `cat-file -e`
          # above proves the sha exists, not that it shares history with HEAD.
          changed=$(mktemp)
          if ! git diff -z --name-only "$range" > "$changed"; then
            echo "loop=true"   >> "$GITHUB_OUTPUT"
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "cuda=true"   >> "$GITHUB_OUTPUT"
            echo "could not diff $range — running everything"
            exit 0
          fi

          loop=false
          engine=false
          cuda=false
          echo "changed files:"
          # -z: a filename with a space or a glob character must not be split into two.
          while IFS= read -r -d "" f; do
            echo "    $f"
            case "$f" in
              src/inference_server/research/*|tests/test_research_*|tests/test_determinism.py|tests/test_venues.py|knowledge/*|experiments/*)
                loop=true ;;
              src/control_plane/*|tests/test_control_plane.py)
                loop=true ;;                    # control plane: stdlib-only policy, no torch
              pyproject.toml|.github/workflows/*)
                loop=true; engine=true ;;
              docs/*|runs/*|*.md)
                ;;                              # never executed, wherever it lives
              *)
                engine=true ;;
            esac
            case "$f" in
              src/inference_server/models/*) cuda=true ;;   # only a GPU can run this
            esac
          done < "$changed"
          echo "loop=$loop"     >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "cuda=$cuda"     >> "$GITHUB_OUTPUT"
          echo "lanes: loop=$loop engine=$engine cuda=$cuda"

  # Installing no torch is the assertion, not an optimisation: if research/ or control_plane/
  # ever imports the engine, this lane goes red on ModuleNotFoundError. README's "the loop knows
  # only the panel contract" is otherwise enforced by nothing.
  loop:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.loop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check src/inference_server/research src/control_plane tests/test_research_*.py tests/test_determinism.py tests/test_venues.py tests/test_control_plane.py
      - name: Tests
        run: PYTHONPATH=src pytest -q tests/test_research_*.py tests/test_determinism.py tests/test_venues.py tests/test_control_plane.py


  engine:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # premerge_check.py diffs against the base branch

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true     # later steps run python/ruff/pytest from .venv

      - name: Cache HF hub
        uses: actions/cache@v4
        with:
          # test_tokenizer / test_server pull the public gpt2 tokenizer. No auth, but a live
          # Hub dependency on every run is flake waiting to happen.
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}

      - name: Install deps
        # Exactly what uv.lock pins; --locked fails if pyproject.toml and the lock disagree.
        # Linux resolves torch from the CPU index (pyproject [tool.uv.sources]).
        run: uv sync --locked --extra dev

      - name: Assert torch stayed on CPU
        # A lock or source change that quietly pulls the CUDA wheel should fail here, not
        # double the job's runtime.
        run: |
          python -c "import torch, sys; v = torch.__version__; \
            sys.exit(0) if v.endswith('+cpu') or torch.version.cuda is None \
            else sys.exit(f'expected a CPU torch wheel, got {v}')"

      - name: Lint
        run: ruff check .

      - name: Tests
        # Model-heavy tests are deselected by tests/conftest.py — they need ~10 GB of weights.
        # This job proves the engine still imports and its logic still holds, nothing about GPUs.
        run: pytest -q

      - name: Engine changes need an experiment record
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: python scripts/premerge_check.py HEAD --base "$BASE" --explain

      - name: Alarm — engine change pushed straight to main
        # The gate above only sees PRs. This cannot prevent a direct push, only make it loud.
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in
            0000000000000000000000000000000000000000|"") echo "no previous sha — skipping"; exit 0 ;;
          esac
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || { echo "$BEFORE not in history (force push?) — skipping"; exit 0; }
          python scripts/premerge_check.py HEAD --base "$BEFORE" --explain

  # Triton compiles only on CUDA, so this rents a GPU through research/venues.py, which needs
  # RUNPOD_API_KEY. Manual, not per-PR.
  gpu:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Bounds the money. A pod bills until terminated; run_instrument terminates in a finally,
    # but a runner killed here never runs it — the reap step at the end does.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - id: start
        # The reaper only touches ci-cuda-gate pods started after this.
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install the launcher only
        # --no-deps: the pod installs the real dependencies remotely. Installing torch here
        # would download 200 MB to launch a job that does not use it.
        run: pip install -e . --no-deps

      - name: Run the CUDA correctness gate
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_GPU: ${{ inputs.runpod_gpu || 'NVIDIA GeForce RTX 4090' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "${RUNPOD_API_KEY:-}" ]; then
            echo "RUNPOD_API_KEY is not set in this repo's secrets."
            echo "Add it (Settings → Secrets → Actions), or run locally:"
            echo "  RUNPOD_API_KEY=... python scripts/tools/run_on_runpod.py scripts/gpu_tests/cuda_gate.py"
            # Asked for by hand: fail. On the weekly tick: say so and stop, do not cry wolf.
            [ "$EVENT" = "schedule" ] && exit 0
            exit 1
          fi
          # One instrument runs every check on one pod; the launcher exits with the verdict.
          exec python scripts/tools/run_on_runpod.py scripts/gpu_tests/cuda_gate.py \
            --gpu "$RUNPOD_GPU" --name ci-cuda-gate

      - name: Reap any pod this job left behind
        # A job killed by timeout-minutes skips every finally on the runner. Pods named
        # ci-cuda-gate (CI's name; humans keep the launcher's default) and started since the
        # job began are terminated here; nothing else is touched. No RUNPOD_API_KEY: nothing
        # was rented, the reaper says so and exits 0.
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python scripts/tools/runpod_reap.py --name ci-cuda-gate --since "${{ steps.start.outputs.at }}"

  # The one check branch protection requires: a skipped lane must not leave a PR blocked
  # forever. Skipped is fine, failed and cancelled are not. The gpu lane is deliberately
  # not aggregated here — it is manual and costs money.
  ci-ok:
    needs: [changes, loop, engine]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.loop.result }} ${{ needs.engine.result }}
        run: |
          echo "changes/loop/engine: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) echo "a lane did not pass"; exit 1 ;;
          esac
          if [ "${{ needs.changes.outputs.cuda }}" = "true" ]; then
            echo "::warning::this PR touches src/inference_server/models/ — CUDA-only code that no lane here can execute. Dispatch the gpu lane before merging."
          fi
          echo "all lanes green or skipped"
