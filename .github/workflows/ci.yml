name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"        # Mondays 07:00 UTC: corpus provenance, which nothing else exercises

permissions:
  contents: read

concurrency:
  # Pushes to main are keyed by sha so back-to-back merges do not cancel each other's run.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Does this change touch the corpus or its builder? Everything else always runs the engine lane.
  changes:
    runs-on: ubuntu-latest
    outputs:
      corpus: ${{ steps.classify.outputs.corpus }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            echo "corpus=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE...HEAD"
          fi
          corpus=false
          if [ -z "$range" ] || ! git diff --name-only "$range" > changed.txt; then
            corpus=true                       # no diffable range: run everything
          elif grep -qE '^(corpus/|scripts/corpus/|lab/corpus\.py|tests/test_lab_corpus\.py)' changed.txt; then
            corpus=true
          fi
          echo "corpus=$corpus" >> "$GITHUB_OUTPUT"
          echo "corpus lane: $corpus"

  # Lint and the fast suite: engine, lab, control plane. CPU only; model-heavy tests are
  # deselected by tests/conftest.py and no kernel runs (Triton compiles only on CUDA; the lab's
  # GPU VM is where kernels get verified, by hand, before a models/ change merges).
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true
      - name: Cache HF hub
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}
      - name: Install deps
        run: uv sync --locked --extra dev
      - name: Assert torch stayed on CPU
        run: |
          python -c "import torch, sys; v = torch.__version__; \
            sys.exit(0) if v.endswith('+cpu') or torch.version.cuda is None \
            else sys.exit(f'expected a CPU torch wheel, got {v}')"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  # Provenance of corpus/: rebuilds it from the pinned raw traces and asserts the committed bytes.
  corpus:
    needs: changes
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true
      - name: Install deps
        run: uv sync --locked --extra dev --extra corpus
      - name: Cache raw traces
        uses: actions/cache@v6
        with:
          path: ~/.cache/inference-server/traces
          key: traces-${{ hashFiles('scripts/corpus/fetch_traces.py') }}
      - name: Fetch and verify raw traces
        run: python scripts/corpus/fetch_traces.py
      - name: Corpus provenance tests
        env:
          CORPUS_REQUIRE_RAW: "1"
        run: pytest -q tests/test_lab_corpus.py

  # The one check branch protection requires. A skipped lane is fine; failed or cancelled is not.
  ci-ok:
    needs: [changes, engine, corpus]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.engine.result }} ${{ needs.corpus.result }}
        run: |
          echo "changes/engine/corpus: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) echo "a lane did not pass"; exit 1 ;;
          esac
          echo "all lanes green or skipped"
