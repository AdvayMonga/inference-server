name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}   # each main push runs to completion
  cancel-in-progress: true

jobs:
  # Lint and the fast suite on CPU. Model-heavy tests are deselected (tests/conftest.py); kernels need CUDA.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          activate-environment: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}
      - run: uv sync --locked --extra dev
      - run: ruff check .
      - run: pytest -q
