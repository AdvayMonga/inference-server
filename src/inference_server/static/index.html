<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inference Server</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: monospace; background: #000; color: #fff; height: 100vh; display: flex; justify-content: center; }

  .chat-panel { flex: 1; max-width: 820px; display: flex; flex-direction: column; padding: 20px; }
  .chat-header { font-size: 1.3em; font-weight: bold; margin-bottom: 4px; }
  .chat-sub { font-size: 0.75em; color: #666; margin-bottom: 14px; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .chat-sub a { color: #888; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 8px 0; }
  .message { margin-bottom: 14px; padding: 12px; border: 1px solid #333; max-width: 85%; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
  .message.user { margin-left: auto; border-color: #666; }
  .message.assistant { border-color: #444; }
  .message.assistant .cursor { display: inline-block; width: 7px; height: 14px; background: #fff; animation: blink 0.8s infinite; vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }

  .input-area { display: flex; gap: 8px; margin-top: 10px; }
  .input-area textarea { flex: 1; background: #111; border: 1px solid #444; color: #fff; padding: 12px; font-family: monospace; font-size: 14px; resize: none; height: 48px; }
  .input-area textarea:focus { outline: none; border-color: #888; }
  .input-area button { border: none; padding: 12px 24px; font-family: monospace; font-size: 14px; font-weight: bold; cursor: pointer; background: #fff; color: #000; }
  .input-area button.stop { background: #333; color: #fff; }
  .input-area button:disabled { opacity: 0.3; cursor: not-allowed; }

  .controls { display: flex; gap: 14px; align-items: center; margin-top: 10px; font-size: 0.75em; color: #888; }
  .controls label { text-transform: uppercase; letter-spacing: 0.5px; }
  .controls input, .controls select { background: #111; border: 1px solid #333; color: #fff; padding: 4px 6px; font-family: monospace; font-size: 12px; }
  .controls input { width: 64px; }

  /* Last-request timings, straight from the response body. Aggregates live in Grafana. */
  .stats { display: flex; gap: 20px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #222; font-size: 0.75em; color: #666; }
  .stats b { color: #fff; font-size: 1.15em; }
</style>
</head>
<body>

<div class="chat-panel">
  <div class="chat-header">inference-server</div>
  <div class="chat-sub">Aggregate metrics are at <a href="/metrics">/metrics</a>, scraped into Grafana. Load generation is <code>scripts/bench/load_test.py</code>.</div>
  <div class="chat-messages" id="messages"></div>

  <div class="input-area">
    <textarea id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">Send</button>
    <button id="stopBtn" class="stop" onclick="stopGeneration()" style="display:none">Stop</button>
  </div>

  <div class="controls">
    <label>Max tokens</label><input type="number" id="s-max-tokens" value="512" min="1" max="4096">
    <label>Stream</label><select id="s-stream"><option value="true" selected>on</option><option value="false">off</option></select>
    <label>Thinking</label><select id="s-thinking"><option value="true">on</option><option value="false" selected>off</option></select>
  </div>

  <div class="stats">
    <span>TTFT <b id="m-ttft">-</b> ms</span>
    <span>TPOT <b id="m-tpot">-</b> ms</span>
    <span>Total <b id="m-total">-</b> ms</span>
    <span>Tokens <b id="m-tokens">-</b></span>
    <span>Tok/s <b id="m-tps">-</b></span>
    <span>Prompt cached <b id="m-cached">-</b></span>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const stopBtn = document.getElementById('stopBtn');
let generating = false;
let abortController = null;

function stopGeneration() {
  if (abortController) abortController.abort();
}

function renderMd(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.+)$/gm, '<b style="font-size:1.1em">$1</b>')
    .replace(/^## (.+)$/gm, '<b style="font-size:1.2em">$1</b>')
    .replace(/^# (.+)$/gm, '<b style="font-size:1.3em">$1</b>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\*(.+?)\*/g, '<i>$1</i>')
    .replace(/`(.+?)`/g, '<code style="background:#222;padding:2px 4px">$1</code>')
    .replace(/^- (.+)$/gm, '&bull; $1')
    .replace(/^---$/gm, '<hr style="border-color:#333">')
    .replace(/\n/g, '<br>');
}

function addMessage(text, role) {
  const el = document.createElement('div');
  el.className = 'message ' + role;
  if (role === 'user') el.textContent = text;
  else el.innerHTML = renderMd(text);
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return el;
}

function setStats(ttft, tpot, total, tokens, cacheHit, promptTokens) {
  const num = (v, d) => (v == null ? '-' : v.toFixed(d));
  document.getElementById('m-ttft').textContent = num(ttft, 0);
  document.getElementById('m-tpot').textContent = num(tpot, 1);
  document.getElementById('m-total').textContent = num(total, 0);
  document.getElementById('m-tokens').textContent = tokens;
  document.getElementById('m-tps').textContent = num(tokens > 0 ? tokens / (total / 1000) : 0, 1);
  document.getElementById('m-cached').textContent =
    promptTokens == null ? '-' : (cacheHit || 0) + ' / ' + promptTokens;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || generating) return;
  generating = true;
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'block';
  abortController = new AbortController();
  inputEl.value = '';

  addMessage(text, 'user');
  const el = addMessage('', 'assistant');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);

  const body = {
    text,
    max_tokens: parseInt(document.getElementById('s-max-tokens').value) || 256,
    stream: document.getElementById('s-stream').value === 'true',
    thinking: document.getElementById('s-thinking').value === 'true',
  };
  const t0 = performance.now();
  let tokens = 0, ttft = null, rawText = '', cacheHit = null, promptTokens = null;

  try {
    const r = await fetch('/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body), signal: abortController.signal,
    });
    if (body.stream) {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const d = line.slice(6);
          if (d === '[DONE]') break;
          if (d.startsWith('{') && d.includes('ttft_ms')) {
            const m = JSON.parse(d);
            ttft = m.ttft_ms;
            cacheHit = m.cache_hit_tokens;
            promptTokens = m.prompt_tokens;
            continue;
          }
          tokens++;
          rawText += d;
          cursor.remove();
          el.innerHTML = renderMd(rawText);
          el.appendChild(cursor);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }
    } else {
      const d = await r.json();
      el.innerHTML = renderMd(d.text);
      tokens = d.tokens_generated;
      ttft = d.ttft_ms;
      cacheHit = d.cache_hit_tokens;
      promptTokens = d.prompt_tokens;
    }
  } catch (e) {
    el.textContent += '\n[Error: ' + e.message + ']';
  }

  cursor.remove();
  const total = performance.now() - t0;
  setStats(ttft, tokens > 1 ? (total - (ttft || 0)) / (tokens - 1) : 0, total, tokens, cacheHit, promptTokens);

  generating = false;
  abortController = null;
  sendBtn.style.display = 'block';
  stopBtn.style.display = 'none';
  inputEl.focus();
}
</script>
</body>
</html>
