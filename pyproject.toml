[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-server"
version = "0.1.0"
description = "LLM inference engine from scratch: continuous batching, paged KV cache, Triton kernels, and a research loop that gates every merge on a measured experiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "matplotlib>=3.8",
]
modal = ["modal>=1.0"]   # GPU instruments (scripts/**/*_modal.py) and modal_app.py

[project.urls]
Repository = "https://github.com/AdvayMonga/inference-server"
"Architecture map" = "https://advaymonga.github.io/inference-server/architecture.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
