<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" role="img" aria-label="Inference server architecture overview">
  <style>
    text { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif; fill: #e6edf3; }
    .lbl   { font: 12px -apple-system, sans-serif; fill: #56d4dd; }
    .title { font: bold 14px -apple-system, sans-serif; fill: #e6edf3; }
    .small { font: 11px -apple-system, sans-serif; fill: #8b949e; }
    rect.box     { fill: #1c232c; stroke: #30363d; stroke-width: 1; }
    rect.http    { fill: #1c2a3a; stroke: #79c0ff; }
    rect.sched   { fill: #2a1f3a; stroke: #d2a8ff; }
    rect.backend { fill: #2a2418; stroke: #ffa657; }
    rect.cache   { fill: #1c2a25; stroke: #3fb950; }
    path.flow        { fill: none; stroke: #8b949e; stroke-width: 1.4; marker-end: url(#arrow); }
    path.flow-strong { fill: none; stroke: #79c0ff; stroke-width: 2;   marker-end: url(#arrow-blue); }
    path.flow-cache  { fill: none; stroke: #3fb950; stroke-width: 1.6; marker-end: url(#arrow-green); }
    path.flow-loop   { fill: none; stroke: #d29922; stroke-width: 1.6; stroke-dasharray: 5 3; marker-end: url(#arrow-yellow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#79c0ff"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
  </defs>

  <rect x="0" y="0" width="1160" height="600" rx="8" fill="#0e1116"/>

  <!-- Client -->
  <g>
    <rect class="box" x="20" y="40" width="160" height="80" rx="6"/>
    <text class="title" x="40" y="68">Client</text>
    <text class="small" x="40" y="88">browser, curl,</text>
    <text class="small" x="40" y="103">load simulator</text>
  </g>

  <!-- HTTP / Server -->
  <g>
    <rect class="box http" x="220" y="20" width="240" height="160" rx="8"/>
    <text class="title" x="240" y="48">HTTP layer (FastAPI)</text>
    <text class="lbl" x="240" y="66">server.py</text>
    <text x="240" y="92">accepts requests</text>
    <text x="240" y="110">tokenizes prompts</text>
    <text x="240" y="128">streams tokens back (SSE)</text>
    <text x="240" y="146">serves the dashboard</text>
    <text class="small" x="240" y="164">/health · /ready for Modal probes</text>
  </g>

  <!-- Scheduler -->
  <g>
    <rect class="box sched" x="500" y="20" width="260" height="280" rx="8"/>
    <text class="title" x="520" y="48">Scheduler</text>
    <text class="lbl" x="520" y="66">scheduler.py</text>
    <text x="520" y="92">decides who runs each tick</text>
    <text x="520" y="110">batches many users together</text>
    <text x="520" y="128">enforces fairness across</text>
    <text x="520" y="143">sessions (FCFS or VTC)</text>
    <text x="520" y="166">protects the system from</text>
    <text x="520" y="181">overload (backpressure)</text>
    <text x="520" y="204">streams long prompts in</text>
    <text x="520" y="219">small chunks</text>
    <rect x="520" y="234" width="220" height="22" rx="3" fill="#1c1c2a" stroke="#555"/>
    <text class="small" x="528" y="249">queues: pending · prefilling · active</text>
  </g>

  <!-- Backend -->
  <g>
    <rect class="box backend" x="800" y="20" width="240" height="160" rx="8"/>
    <text class="title" x="820" y="48">Inference Backend</text>
    <text class="lbl" x="820" y="66">backends/torch_backend.py</text>
    <text x="820" y="92">runs the model</text>
    <text x="820" y="110">handles prefill + decode</text>
    <text x="820" y="128">picks the best hardware</text>
    <text x="820" y="146">(CUDA → MPS → CPU)</text>
  </g>

  <!-- Model -->
  <g>
    <rect class="box" x="1060" y="60" width="80" height="80" rx="6"/>
    <text class="title" x="1075" y="92">Model</text>
    <text class="small" x="1075" y="110">Gemma 4</text>
    <text class="small" x="1075" y="124">E2B / E4B</text>
  </g>

  <!-- KV cache -->
  <g>
    <rect class="box cache" x="500" y="340" width="540" height="220" rx="8"/>
    <text class="title" x="520" y="368">KV Cache (paged, session-aware)</text>
    <text class="lbl" x="520" y="386">kv_cache/cache_manager.py</text>
    <text x="520" y="412">remembers attention state for the prompt prefix</text>
    <text x="520" y="430">so repeated or shared prompts skip the prefill cost</text>

    <rect class="box" x="520" y="448" width="155" height="50" rx="4"/>
    <text class="title" x="532" y="467">Exact-match index</text>
    <text class="small" x="532" y="485">whole-prompt fast path</text>

    <rect class="box" x="690" y="448" width="155" height="50" rx="4"/>
    <text class="title" x="702" y="467">Radix tree</text>
    <text class="small" x="702" y="485">prefix sharing across sessions</text>

    <rect class="box" x="860" y="448" width="160" height="50" rx="4"/>
    <text class="title" x="872" y="467">Block pool + eviction</text>
    <text class="small" x="872" y="485">LRU · SinkLRU · H2O</text>
  </g>

  <!-- Tokenizer -->
  <g>
    <rect class="box" x="220" y="220" width="240" height="80" rx="6"/>
    <text class="title" x="240" y="246">Tokenizer</text>
    <text class="lbl" x="240" y="262">tokenizer.py</text>
    <text class="small" x="240" y="280">turns text ↔ token IDs,</text>
    <text class="small" x="240" y="294">applies chat template</text>
  </g>

  <!-- Metrics -->
  <g>
    <rect class="box" x="220" y="340" width="240" height="100" rx="6"/>
    <text class="title" x="240" y="368">Metrics tracker</text>
    <text class="lbl" x="240" y="384">metrics.py</text>
    <text class="small" x="240" y="402">records TTFT, TPOT,</text>
    <text class="small" x="240" y="416">throughput in a 60s window</text>
    <text class="small" x="240" y="432">surfaces p50/p95/p99</text>
  </g>

  <!-- Simulator -->
  <g>
    <rect class="box" x="20" y="160" width="160" height="120" rx="6"/>
    <text class="title" x="40" y="188">Load simulator</text>
    <text class="lbl" x="40" y="204">simulator_prompts.py</text>
    <text class="small" x="40" y="224">multi-user traffic,</text>
    <text class="small" x="40" y="240">weighted prompts,</text>
    <text class="small" x="40" y="256">jittered think-time</text>
  </g>

  <!-- Dashboard -->
  <g>
    <rect class="box" x="20" y="320" width="160" height="120" rx="6"/>
    <text class="title" x="40" y="348">Dashboard</text>
    <text class="lbl" x="40" y="364">static/index.html</text>
    <text class="small" x="40" y="384">live metrics,</text>
    <text class="small" x="40" y="400">cache stats,</text>
    <text class="small" x="40" y="416">scheduler stats</text>
  </g>

  <!-- Config -->
  <g>
    <rect class="box" x="20" y="480" width="440" height="80" rx="6"/>
    <text class="title" x="40" y="508">Config (env vars)</text>
    <text class="lbl" x="40" y="524">config.py — DEVICE, MODEL_NAME, MAX_BATCH_SIZE,</text>
    <text class="lbl" x="40" y="540">MAX_ACTIVE_KV_TOKENS, PREFILL_CHUNK_SIZE,</text>
    <text class="lbl" x="40" y="556">EVICTION_POLICY, SCHEDULING_POLICY, KV_CACHE_*</text>
  </g>

  <!-- Arrows -->
  <path class="flow-strong" d="M180,80 L220,80"/>
  <path class="flow-strong" d="M460,100 L500,100"/>
  <path class="flow-strong" d="M760,100 L800,100"/>
  <path class="flow" d="M1040,100 L1060,100"/>
  <path class="flow-cache" d="M870,180 L770,340"/>
  <path class="flow" d="M340,180 L340,220"/>
  <path class="flow" d="M460,260 L500,200"/>
  <path class="flow" d="M460,380 L500,380"/>
  <path class="flow" d="M180,220 L220,100"/>
  <path class="flow-loop" d="M620,300 C 620,330 620,335 620,340"/>
</svg>
