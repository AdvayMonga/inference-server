# Prometheus scrape config for the inference server's /metrics endpoint.
# Used by docker-compose.yml in this directory. Standalone usage:
#   prometheus --config.file=monitoring/prometheus.yml   # then set the target to localhost:8000
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: inference-server
    metrics_path: /metrics
    static_configs:
      # The server runs outside this stack. host.docker.internal reaches the host from
      # inside the Prometheus container; use localhost:8000 when running Prometheus
      # directly on the host, or the Modal hostname (plus `scheme: https`) when deployed.
      - targets: ["host.docker.internal:8000"]
